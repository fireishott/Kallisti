[workspace]
resolver = "3"
members = [
    "crates/core-domain",
    "crates/core-runtime",
    "crates/eris-host",
    "crates/ios-host",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

# Pinned versions resolved live from crates.io. Do not use `cargo add`
# without them, and do not re-pin a version inside a member crate.
[workspace.dependencies]
axum = "0.8.9"
tokio = "1.53.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = "4.6.7"
zstd = "0.14.3"
sha2 = "0.11.1"
argon2 = "0.6.0"
getrandom = "0.4.3"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
time = "0.3.55"
# reqwest 0.13.5 renamed the TLS feature: `rustls-tls` (the 0.12 name, and the
# name the P4 brief carried) does not exist in 0.13. The 0.13 spelling is
# `rustls`, and the rest of the pin is unchanged.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
base64 = "0.23.1"
hex = "0.4.3"
subtle = "2.6.1"
maud = "0.27.0"
tower = "0.5.3"
tower-http = "0.7.1"
tokio-stream = "0.1.19"
tempfile = "3.27.0"
uniffi = "0.32.2"
typeshare = "1.0.5"
schemars = "1.2.3"
fs4 = "1.1.0"
eventsource-stream = "0.2.3"
