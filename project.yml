name: Kallisti
options:
  # Public-safe defaults. Replace locally if you regenerate the project
  # for a private deployment with your own signing/bundle identifiers.
  bundleIdPrefix: net.fihonline
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "26.3"
  defaultConfig: Debug
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    WATCHOS_DEPLOYMENT_TARGET: "11.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-GlassCoin
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: true

schemes:
  Kallisti:
    build:
      targets:
        Kallisti: all
        KallistiWidgets: all
        KallistiIntents: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: KallistiTests
          parallelizable: true
        - name: KallistiUITests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  KallistiWatch:
    build:
      targets:
        KallistiWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Kallisti:
    type: application
    platform: iOS
    entitlements:
      path: Kallisti/Kallisti.entitlements
      properties:
        com.apple.developer.siri: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: production
        com.apple.security.application-groups:
          - group.net.fihonline.kallisti
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.kallisti.shared
    sources:
      - path: Kallisti
        excludes:
          - "**/.DS_Store"
          # Build 108: exclude Watch WIP files until Task 10 finishes them.
          # These reference types defined in the Watch target that are not
          # yet integrated into the iOS build.
          - "Services/Live/PhoneWatchConnectivityCoordinator.swift"
          - "Services/Live/WatchActionBridge.swift"
      - path: KallistiWidgets/KallistiAppState.swift
      - path: KallistiWidgets/GatewayState.swift
      - path: KallistiWidgets/KallistiActivityAttributes.swift
      - path: Herald/Services/Protocols/NotificationCategories.swift
    resources:
      - path: Kallisti/Resources
        optional: true
    dependencies:
      - target: KallistiSupport
      - target: KallistiWidgets
      - target: KallistiNotificationService
      - target: KallistiIntents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti
        PRODUCT_NAME: Kallisti
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "131.7"
        DEVELOPMENT_TEAM: 58U7UPFS53
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: true
        INFOPLIST_KEY_CFBundleDisplayName: Kallisti
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    info:
      path: Kallisti/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kallisti
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Kallisti uses your location to provide contextual recommendations and nearby suggestions."
        NSHealthShareUsageDescription: "Kallisti reads your health data to offer personalized wellness insights."
        NSHealthUpdateUsageDescription: "Kallisti does not write health data, but this permission is required by the system."
        NSCameraUsageDescription: "Kallisti uses the camera to capture photos and documents for analysis."
        NSPhotoLibraryUsageDescription: "Kallisti accesses your photo library to help organize and search your photos."
        NSMicrophoneUsageDescription: "Kallisti uses the microphone for voice conversations in Talk Mode."
        NSSiriUsageDescription: "Kallisti uses Siri to send and read messages on CarPlay and with voice commands."
        INIntentsSupported:
          - INSendMessageIntent
          - INSearchForMessagesIntent
          - INSetMessageAttributeIntent
        NSLocationAlwaysAndWhenInUseUsageDescription: "Kallisti uses your location in the background to provide contextual awareness and proactive suggestions."
        NSMotionUsageDescription: "Kallisti uses motion data to understand your current activity for contextual awareness."
        NSSpeechRecognitionUsageDescription: "Kallisti uses speech recognition for voice commands and local transcription."
        APP_HOSTED_RELAY_URL: "https://your-relay.example.com/v1"
        APP_HOSTED_RELAY_ENABLED: true
        APP_PRIVACY_URL: "https://kallisti.fihonline.net/privacy.html"
        APP_TERMS_URL: "https://kallisti.fihonline.net/terms.html"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - net.fihonline.kallisti.refresh
          - net.fihnews.HeraldBGProcessing
        UIBackgroundModes:
          - processing
          - location
          - remote-notification
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        NSUserActivityTypes:
          - net.fihonline.kallisti.viewNote
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"

  KallistiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KallistiWidgets
    entitlements:
      path: KallistiWidgets/KallistiWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.kallisti
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.kallisti.shared
    info:
      path: KallistiWidgets/Info.plist
      properties:
        CFBundleDisplayName: KallistiWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.Widgets
        PRODUCT_NAME: KallistiWidgets
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "131.7"
        SWIFT_VERSION: "6.2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: KallistiSupport

  KallistiNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: KallistiNotificationService
      - path: Herald/Services/Protocols/NotificationCategories.swift
    dependencies:
      - target: KallistiSupport
    entitlements:
      path: KallistiNotificationService/KallistiNotificationService.entitlements
      properties:
        aps-environment: production
        com.apple.security.application-groups:
          - group.net.fihonline.kallisti
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.kallisti.shared
    info:
      path: KallistiNotificationService/Info.plist
      properties:
        CFBundleDisplayName: KallistiNotificationService
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.NotificationService
        PRODUCT_NAME: KallistiNotificationService
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "131.7"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: KallistiSupport

  KallistiIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: KallistiIntents
    entitlements:
      path: KallistiIntents/KallistiIntents.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.kallisti
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.kallisti.shared
    info:
      path: KallistiIntents/Info.plist
      properties:
        CFBundleDisplayName: KallistiIntents
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).IntentHandler"
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
              - INSearchForMessagesIntent
              - INSetMessageAttributeIntent
            IntentsRestrictedWhileLocked: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.Intents
        PRODUCT_NAME: KallistiIntents
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "131.7"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: KallistiSupport

  KallistiControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KallistiControls
    entitlements:
      path: KallistiControls/KallistiControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.kallisti
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.kallisti.shared
    settings:
      base:
        INFOPLIST_FILE: KallistiControls/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.controlsWidget
        PRODUCT_NAME: KallistiControls
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "131.7"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: KallistiSupport

  KallistiSupport:
    type: library.static
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KallistiSupport
    settings:
      base:
        PRODUCT_NAME: KallistiSupport
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.support
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  KallistiWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: KallistiWatch
      - path: Herald/Services/Protocols/NotificationCategories.swift
    entitlements:
      path: KallistiWatch/KallistiWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.kallisti
    info:
      path: KallistiWatch/Info.plist
      properties:
        CFBundleDisplayName: KallistiWatch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.fihonline.kallisti
        WKWatchOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.watchkitapp
        PRODUCT_NAME: KallistiWatch
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "131.7"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  KallistiWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: KallistiWatchTests
      - path: KallistiWatch/WatchNotificationPayload.swift
      - path: KallistiWatch/WatchConnectivityCoordinator.swift
      - path: Herald/Services/Protocols/NotificationCategories.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.watchkitapp.tests
        PRODUCT_NAME: KallistiWatchTests
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KallistiWatch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HeraldWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"

  KallistiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KallistiTests
    dependencies:
      - target: Kallisti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.tests
        PRODUCT_NAME: KallistiTests
        TEST_TARGET_NAME: Herald
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  KallistiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KallistiUITests
    dependencies:
      - target: Kallisti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.uitests
        PRODUCT_NAME: KallistiUITests
        TEST_TARGET_NAME: Herald
        GENERATE_INFOPLIST_FILE: true
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  KallistiControlsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KallistiControlsTests
    dependencies:
      - target: KallistiSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.kallisti.controlstests
        PRODUCT_NAME: KallistiControlsTests
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
