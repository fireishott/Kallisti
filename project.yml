name: Herald
options:
  # Public-safe defaults. Replace locally if you regenerate the project
  # for a private deployment with your own signing/bundle identifiers.
  bundleIdPrefix: net.fihonline
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "26.3"
  defaultConfig: Debug
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    WATCHOS_DEPLOYMENT_TARGET: "11.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: true

schemes:
  Herald:
    build:
      targets:
        Herald: all
        HeraldWidgets: all
        HeraldIntents: all
        HeraldControls: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: HeraldTests
          parallelizable: true
        - name: HeraldUITests
          parallelizable: true
        - name: HeraldControlsTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HeraldWatch:
    build:
      targets:
        HeraldWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: HeraldWatchTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Herald:
    type: application
    platform: iOS
    entitlements:
      path: Herald/Herald.entitlements
      properties:
        com.apple.developer.siri: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: production
        com.apple.security.application-groups:
          - group.net.fihonline.herald
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.herald.shared
    sources:
      - path: Herald
        excludes:
          - "**/.DS_Store"
          # Build 108: exclude Watch WIP files until Task 10 finishes them.
          # These reference types defined in the Watch target that are not
          # yet integrated into the iOS build.
          - "Services/Live/PhoneWatchConnectivityCoordinator.swift"
          - "Services/Live/WatchActionBridge.swift"
      - path: HeraldWidgets/HeraldAppState.swift
      - path: HeraldWidgets/GatewayState.swift
      - path: HeraldWidgets/HeraldActivityAttributes.swift
      - path: Herald/Services/Protocols/NotificationCategories.swift
    resources:
      - path: Herald/Resources
        optional: true
    dependencies:
      - target: HeraldSupport
      - target: HeraldWidgets
      - target: HeraldNotificationService
      - target: HeraldIntents
      - target: HeraldControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald
        PRODUCT_NAME: Herald
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "108"
        DEVELOPMENT_TEAM: 58U7UPFS53
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: true
        INFOPLIST_KEY_CFBundleDisplayName: Herald
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    info:
      path: Herald/Resources/Info.plist
      properties:
        CFBundleDisplayName: Herald
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Herald uses your location to provide contextual recommendations and nearby suggestions."
        NSHealthShareUsageDescription: "Herald reads your health data to offer personalized wellness insights."
        NSHealthUpdateUsageDescription: "Herald does not write health data, but this permission is required by the system."
        NSCameraUsageDescription: "Herald uses the camera to capture photos and documents for analysis."
        NSPhotoLibraryUsageDescription: "Herald accesses your photo library to help organize and search your photos."
        NSMicrophoneUsageDescription: "Herald uses the microphone for voice conversations in Talk Mode."
        NSSiriUsageDescription: "Herald uses Siri to send and read messages on CarPlay and with voice commands."
        INIntentsSupported:
          - INSendMessageIntent
          - INSearchForMessagesIntent
          - INSetMessageAttributeIntent
        NSLocationAlwaysAndWhenInUseUsageDescription: "Herald uses your location in the background to provide contextual awareness and proactive suggestions."
        NSMotionUsageDescription: "Herald uses motion data to understand your current activity for contextual awareness."
        NSSpeechRecognitionUsageDescription: "Herald uses speech recognition for voice commands and local transcription."
        APP_HOSTED_RELAY_URL: "https://your-relay.example.com/v1"
        APP_HOSTED_RELAY_ENABLED: true
        APP_PRIVACY_URL: "https://herald.fihonline.net/privacy.html"
        APP_TERMS_URL: "https://herald.fihonline.net/terms.html"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - net.fihonline.herald.refresh
          - net.fihnews.HeraldBGProcessing
        UIBackgroundModes:
          - processing
          - location
          - remote-notification
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        NSUserActivityTypes:
          - net.fihonline.herald.viewNote
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"

  HeraldWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HeraldWidgets
    entitlements:
      path: HeraldWidgets/HeraldWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.herald
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.herald.shared
    info:
      path: HeraldWidgets/Info.plist
      properties:
        CFBundleDisplayName: HeraldWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.Widgets
        PRODUCT_NAME: HeraldWidgets
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "108"
        SWIFT_VERSION: "6.2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: HeraldSupport

  HeraldNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: HeraldNotificationService
      - path: Herald/Services/Protocols/NotificationCategories.swift
    entitlements:
      path: HeraldNotificationService/HeraldNotificationService.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.net.fihonline.herald
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.herald.shared
    info:
      path: HeraldNotificationService/Info.plist
      properties:
        CFBundleDisplayName: HeraldNotificationService
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.NotificationService
        PRODUCT_NAME: HeraldNotificationService
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "108"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: HeraldSupport

  HeraldIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: HeraldIntents
    entitlements:
      path: HeraldIntents/HeraldIntents.entitlements
      properties:
        com.apple.developer.siri: true
        com.apple.security.application-groups:
          - group.net.fihonline.herald
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.herald.shared
    info:
      path: HeraldIntents/Info.plist
      properties:
        CFBundleDisplayName: HeraldIntents
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).IntentHandler"
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
              - INSearchForMessagesIntent
              - INSetMessageAttributeIntent
            IntentsRestrictedWhileLocked: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.Intents
        PRODUCT_NAME: HeraldIntents
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "108"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: HeraldSupport

  HeraldControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HeraldControls
    entitlements:
      path: HeraldControls/HeraldControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.herald
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.fihonline.herald.shared
    settings:
      base:
        INFOPLIST_FILE: HeraldControls/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.Controls
        PRODUCT_NAME: HeraldControls
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "108"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: HeraldSupport

  HeraldSupport:
    type: library.static
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HeraldSupport
    settings:
      base:
        PRODUCT_NAME: HeraldSupport
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.support
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  HeraldWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: HeraldWatch
      - path: Herald/Services/Protocols/NotificationCategories.swift
    entitlements:
      path: HeraldWatch/HeraldWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.fihonline.herald
    info:
      path: HeraldWatch/Info.plist
      properties:
        CFBundleDisplayName: HeraldWatch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.fihonline.herald
        WKWatchOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.watchkitapp
        PRODUCT_NAME: HeraldWatch
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "108"
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58U7UPFS53
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  HeraldWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: HeraldWatchTests
      - path: HeraldWatch/WatchNotificationPayload.swift
      - path: HeraldWatch/WatchConnectivityCoordinator.swift
      - path: Herald/Services/Protocols/NotificationCategories.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.watchkitapp.tests
        PRODUCT_NAME: HeraldWatchTests
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeraldWatch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HeraldWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HeraldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeraldTests
    dependencies:
      - target: Herald
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.tests
        PRODUCT_NAME: HeraldTests
        TEST_TARGET_NAME: Herald
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  HeraldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HeraldUITests
    dependencies:
      - target: Herald
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.uitests
        PRODUCT_NAME: HeraldUITests
        TEST_TARGET_NAME: Herald
        GENERATE_INFOPLIST_FILE: true
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  HeraldControlsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HeraldControlsTests
    dependencies:
      - target: HeraldSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fihonline.herald.controlstests
        PRODUCT_NAME: HeraldControlsTests
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
