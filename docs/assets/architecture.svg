<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="#0A0A0A"/>
  <!-- iPhone -->
  <rect x="30" y="60" width="140" height="80" rx="12" fill="#1A1D23" stroke="#F5F0E8" stroke-width="1"/>
  <text x="100" y="105" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F5F0E8" text-anchor="middle">iPhone / iPad</text>
  <!-- Connector -->
  <rect x="310" y="40" width="200" height="120" rx="12" fill="#1A1D23" stroke="#F5F0E8" stroke-width="1"/>
  <text x="410" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F5F0E8" text-anchor="middle" font-weight="600">Connector</text>
  <line x1="370" y1="75" x2="450" y2="75" stroke="#333" stroke-width="0.5"/>
  <text x="410" y="93" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">HTTP Facade (SSE)</text>
  <text x="410" y="110" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Relay Protocol (WS)</text>
  <text x="410" y="127" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">MCP Server</text>
  <!-- Runtime -->
  <rect x="630" y="60" width="150" height="80" rx="12" fill="#1A1D23" stroke="#F5F0E8" stroke-width="1"/>
  <text x="705" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F5F0E8" text-anchor="middle">Runtime</text>
  <text x="705" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Hermes Gateway</text>
  <!-- Connecting lines -->
  <line x1="170" y1="100" x2="310" y2="100" stroke="#FF6B00" stroke-width="2"/>
  <line x1="510" y1="100" x2="630" y2="100" stroke="#FF6B00" stroke-width="2"/>
  <!-- Labels -->
  <text x="240" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FF6B00" text-anchor="middle">HTTPS / SSE</text>
  <text x="570" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FF6B00" text-anchor="middle">WebSocket</text>
</svg>
