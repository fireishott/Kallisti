name: release

# Builds the prebuilt binaries `install.sh` looks for, and attaches them to the
# release for the tag that triggered the run. Without this job the installer has
# no asset to download and every fresh box falls back to a source build, so this
# workflow is what makes the one-line install actually one line.
#
# Asset naming is a contract with install.sh:
#   eris-<tag>-linux-x86_64.tar.gz
#   eris-<tag>-linux-x86_64.tar.gz.sha256
# Each tarball holds a single `eris` binary at its root.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build assets for'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # Native arm64 runner, not an emulated cross-build: a Rust release
          # build under QEMU takes long enough to hit the job timeout.
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pinned toolchain
        run: >-
          rustup toolchain install 1.99.1
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Build
        run: cargo build --release --locked

      - name: Name the tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p dist/pkg
          install -m 755 target/release/eris dist/pkg/eris
          # The licence travels with the binary because MIT requires it to.
          install -m 644 LICENSE dist/pkg/LICENSE
          tar czf "dist/eris-${tag}-linux-${{ matrix.arch }}.tar.gz" -C dist/pkg .
          ( cd dist && sha256sum "eris-${tag}-linux-${{ matrix.arch }}.tar.gz" \
              > "eris-${tag}-linux-${{ matrix.arch }}.tar.gz.sha256" )
          cat "dist/eris-${tag}-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Smoke-test the binary
        run: |
          ./target/release/eris --version
          ./target/release/eris version

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # A tag push creates the release if it is missing; workflow_dispatch
          # against an existing tag just adds assets to it.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Kallisti $tag" --notes "Built from $tag."
          gh release upload "$tag" dist/eris-* --clobber
